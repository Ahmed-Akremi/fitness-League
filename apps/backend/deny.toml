# Checked by `cargo deny check` in CI.

[advisories]
# A crate with a known vulnerability, or one that was withdrawn by its author, fails the build.
yanked = "deny"

[licenses]
# Permissive licences only. Never add a copyleft licence (GPL, AGPL, LGPL) to make the check pass:
# replace the crate instead.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "0BSD",
]

[licenses.private]
# The application itself is not published and carries no licence.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
# Crates come from crates.io only.
unknown-registry = "deny"
unknown-git = "deny"
