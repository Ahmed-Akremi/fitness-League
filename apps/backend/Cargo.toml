[package]
name = "backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
description = "Fitness League API"

[dependencies]
argon2 = { version = "0.6", features = ["alloc", "getrandom", "password-hash"] }
axum = "0.8"
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dotenvy = "0.15"
getrandom = "0.4"
hmac = "0.13"
ipnet = "2"
# aws_lc_rs rather than rust_crypto: the latter pulls in the `rsa` crate (RUSTSEC-2023-0071, no fix), which this
# API never uses since tokens are Ed25519 only.
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
redis = { version = "1", features = ["tokio-comp", "connection-manager", "script"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "mysql", "macros", "migrate", "uuid", "chrono"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.7", features = ["catch-panic", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
unicode-normalization = "0.1"
uuid = { version = "1", features = ["serde", "v7"] }

[dev-dependencies]
http-body-util = "0.1"
tokio = { version = "1", features = ["io-util", "test-util"] }
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
overflow-checks = true
