name: fitness_league
description: Fitness League — compete with yourself, challenge your friends, climb the League.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^2.6.1
  go_router: ^16.0.0
  dio: ^5.8.0
  flutter_secure_storage: ^9.2.4
  drift: ^2.26.0
  drift_flutter: ^0.2.4
  path_provider: ^2.1.5
  uuid: ^4.5.1
  connectivity_plus: ^6.1.4
  fl_chart: ^1.0.0
  shared_preferences: ^2.5.3
  image_picker: ^1.2.3
  cached_network_image: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.26.0
  build_runner: ^2.4.15

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/demo/api.json  # offline demo only (--dart-define=DEMO=true)
  fonts:
    - family: BarlowCondensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BarlowCondensed-ExtraBold.ttf
          weight: 800
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
